[project]
name = "roster-lab-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx", "ortools"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
venvPath = ".."
venv = ".venv"
include = ["app", "tests"]
